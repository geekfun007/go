server:
  address: "0.0.0.0"
  port: 8080
  read_timeout: 5 # seconds
  write_timeout: 5 # seconds

etcd:
  endpoints:
    - "127.0.0.1:2379"

jwt:
  secret: "your-super-secret-key-change-in-production"
  expire_hours: 24

log:
  level: "info"
  filename: "logs/api-gateway.log"

cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"
